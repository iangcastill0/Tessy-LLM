name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_from_source:
        description: "Also validate the from-source Tesseract build"
        type: boolean
        default: false
      package_app:
        description: "Build the double-clickable apps for all platforms"
        type: boolean
        default: false
  schedule:
    # Weekly, so the from-source build script keeps being exercised even when
    # nobody touches it.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests

  unit:
    name: Unit tests (no tesseract)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        # Neither tesseract nor a display is present here: this proves the
        # tesseract-free units (parsing, indexing, ingest, and the GUI's job
        # runner) stay independent of both, and that the suite skips rather
        # than fails without them.
        run: pytest -q -m "not requires_tesseract" --cov=tessy --cov-report=xml

  integration:
    name: Integration tests (packaged tesseract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tesseract and desktop test deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            tesseract-ocr tesseract-ocr-eng fonts-liberation \
            python3-tk xvfb
      - name: Show tesseract version
        run: tesseract --version && tesseract --list-langs
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run full suite
        # xvfb-run supplies a display so the tkinter tests run instead of
        # skipping; without it the desktop app would only ever be lint-checked.
        run: xvfb-run -a pytest -q --cov=tessy --cov-report=term-missing
      - name: Smoke-test the CLI
        run: tessy doctor
      - name: Smoke-test the desktop app launches
        run: |
          xvfb-run -a python - <<'PY'
          import tkinter as tk
          from tessy.gui.app import TessyApp
          root = tk.Tk(); root.withdraw()
          app = TessyApp(root, db_path="ci-smoke.db")
          assert app.tree is not None
          root.destroy()
          print("desktop app constructed and torn down cleanly")
          PY

  build-from-source:
    name: Build tesseract from source
    # Expensive (~10 min), so only on a schedule, manual request, or when the
    # build script itself changes.
    if: >
      github.event_name == 'schedule' ||
      inputs.build_from_source ||
      contains(github.event.head_commit.message, '[build-tesseract]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for the build self-test
        run: pip install Pillow
      - name: Run the build script
        run: ./scripts/build_tesseract.sh
      - name: Verify the resulting install
        run: |
          tesseract --version
          tesseract --list-langs
      - name: Run the suite against the from-source build
        run: |
          pip install -e ".[dev]"
          pytest -q

  package-app:
    name: Desktop app (${{ matrix.os }})
    # PyInstaller cannot cross-compile, so each platform builds on its own
    # runner. Expensive, so this runs on tags, on request, or when the
    # packaging inputs themselves change.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.package_app ||
      github.event_name == 'schedule' ||
      contains(github.event.head_commit.message, '[package]')
    needs: [lint, unit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Tessy-linux
            app: dist/tessy
          - os: macos-latest
            artifact: Tessy-macos
            app: dist/Tessy.app/Contents/MacOS/Tessy
          - os: windows-latest
            artifact: Tessy-windows
            app: dist/Tessy.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng \
            tesseract-ocr-osd python3-tk fonts-liberation

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install --no-progress -y tesseract
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Show Tesseract
        run: |
          tesseract --version
          tesseract --list-langs

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build
        run: pyinstaller packaging/tessy.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Verify the packaged app
        # The real gate. A build that produces a file which cannot OCR is worse
        # than no build: a missing tessdata/configs once made every document
        # come back empty while the binary still exited 0.
        run: |
          "${{ matrix.app }}" --doctor
          "${{ matrix.app }}" --selftest
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/tessy
            dist/Tessy.exe
            dist/Tessy.app
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build distribution
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: tessy-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
